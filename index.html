<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CatatAI — Pencatat Keuangan & Struk Otomatis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .loader {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #059669;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex justify-center text-slate-800">

  <!-- Container Utama (Ukuran Mobile App) -->
  <div class="w-full max-w-md bg-white min-h-screen shadow-xl flex flex-col justify-between relative">
    
    <div>
      <!-- Header -->
      <header class="bg-emerald-600 text-white px-5 pt-6 pb-8 rounded-b-3xl shadow-md">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs uppercase tracking-wider bg-emerald-700/70 px-2.5 py-1 rounded-full font-medium">AI Expense Tracker</span>
            <h1 class="text-xl font-bold mt-2">Catat Pengeluaran</h1>
            <p class="text-emerald-100 text-xs mt-0.5">Foto struk atau ketik catatan, otomatis masuk Sheets</p>
          </div>
          <button onclick="toggleSettings()" title="Pengaturan Webhook" class="p-2.5 bg-emerald-700/60 hover:bg-emerald-700 rounded-xl transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Panel Pengaturan Webhook (Tersembunyi secara default) -->
      <div id="settingsPanel" class="hidden mx-4 -mt-4 bg-slate-800 text-white p-4 rounded-2xl shadow-lg border border-slate-700 z-10 relative">
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">URL Custom Webhook (Make.com)</label>
        <input type="url" id="webhookInput" placeholder="https://hook.us2.make.com/..." 
               class="w-full text-xs bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-400">
        <div class="flex justify-between items-center mt-3">
          <span class="text-[11px] text-slate-400">Tersimpan otomatis di browser HP</span>
          <button onclick="saveWebhook()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold px-3.5 py-1.5 rounded-lg transition">
            Simpan URL
          </button>
        </div>
      </div>

      <!-- Tab Pilihan Mode Input -->
      <div class="px-5 mt-5">
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl">
          <button id="tabTeks" onclick="switchTab('teks')" class="py-2 text-sm font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition">
            Ketik Cepat
          </button>
          <button id="tabGambar" onclick="switchTab('gambar')" class="py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition">
            Foto Struk
          </button>
        </div>
      </div>

      <!-- Form Input -->
      <form id="expenseForm" class="px-5 mt-5 space-y-4">
        
        <!-- Bagian Input Teks -->
        <div id="sectionTeks" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1.5">Catatan Transaksi</label>
            <textarea id="teksCatatan" rows="3" 
              placeholder="Contoh: Beli token listrik PLN 200rb pakai mBCA"
              class="w-full rounded-xl border border-slate-200 p-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"></textarea>
          </div>
          <!-- Contoh Cepat -->
          <div class="flex flex-wrap gap-1.5">
            <button type="button" onclick="fillExample('Makan siang ayam bakar 28rb cash')" class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full transition">
              + Makan siang 28rb
            </button>
            <button type="button" onclick="fillExample('Isi bensin Pertalite 50rb pakai GoPay')" class="text-[11px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2.5 py-1 rounded-full transition">
              + Bensin 50rb
            </button>
          </div>
        </div>

        <!-- Bagian Input Foto Struk -->
        <div id="sectionGambar" class="hidden space-y-3">
          <label class="block text-xs font-semibold text-slate-600">Ambil Foto / Pilih Struk Belanja</label>
          
          <label for="fileStruk" class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-slate-300 rounded-2xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition overflow-hidden relative">
            <div id="uploadPlaceholder" class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
              <svg class="w-9 h-9 mb-2 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <p class="text-xs font-semibold text-slate-700">Tap untuk buka kamera atau galeri</p>
              <p class="text-[11px] text-slate-400 mt-1">JPG, PNG (Otomatis dikompres agar cepat)</p>
            </div>
            <img id="imagePreview" class="hidden w-full h-full object-contain bg-slate-900" alt="Preview Struk" />
            <input id="fileStruk" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)" />
          </label>

          <input type="text" id="catatanTambahanGambar" placeholder="Keterangan tambahan (opsional, misal: bayar pakai BCA)" 
            class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Tombol Submit -->
        <button type="submit" id="submitBtn" 
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 transition">
          <span id="btnText">Kirim & Catat Otomatis</span>
          <div id="btnLoader" class="loader hidden"></div>
        </button>
      </form>

      <!-- Kotak Status / Hasil AI -->
      <div id="resultBox" class="hidden mx-5 mt-5 p-4 rounded-2xl border"></div>

      <!-- Riwayat Sesi Lokal -->
      <div class="px-5 mt-6 pb-8">
        <div class="flex items-center justify-between mb-2.5">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Terkirim Baru-Baru Ini</h2>
          <button onclick="clearHistory()" class="text-[11px] text-slate-400 hover:text-rose-500">Bersihkan</button>
        </div>
        <div id="historyList" class="space-y-2 text-xs text-slate-500">
          <p class="italic text-slate-400 text-center py-3">Belum ada transaksi dikirim dari perangkat ini.</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-[11px] text-slate-400 border-t border-slate-100">
      Powered by Gemini AI & Make Automation
    </footer>
  </div>

  <script>
    // ==========================================
    // KONFIGURASI DEFAULT (Ganti dengan URL Webhook antum)
    // ==========================================
    const DEFAULT_WEBHOOK_URL = "https://hook.us2.make.com/GANTI_DENGAN_URL_WEBHOOK_ANTUM";

    let activeTab = 'teks';
    let compressedBase64 = "";

    // Inisialisasi saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
      const savedUrl = localStorage.getItem("custom_webhook_url");
      document.getElementById("webhookInput").value = savedUrl || DEFAULT_WEBHOOK_URL;
      renderHistory();
    });

    function getWebhookUrl() {
      return localStorage.getItem("custom_webhook_url") || DEFAULT_WEBHOOK_URL;
    }

    function toggleSettings() {
      document.getElementById("settingsPanel").classList.toggle("hidden");
    }

    function saveWebhook() {
      const url = document.getElementById("webhookInput").value.trim();
      if (!url.startsWith("http")) {
        alert("Masukkan URL Webhook Make.com yang valid.");
        return;
      }
      localStorage.setItem("custom_webhook_url", url);
      toggleSettings();
      showResult("success", "Pengaturan Disimpan", "URL Webhook berhasil diperbarui di perangkat ini.");
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabTeks = document.getElementById("tabTeks");
      const tabGambar = document.getElementById("tabGambar");
      const secTeks = document.getElementById("sectionTeks");
      const secGambar = document.getElementById("sectionGambar");

      if (tab === 'teks') {
        tabTeks.className = "py-2 text-sm font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition";
        tabGambar.className = "py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition";
        secTeks.classList.remove("hidden");
        secGambar.classList.add("hidden");
      } else {
        tabGambar.className = "py-2 text-sm font-semibold rounded-lg bg-white text-emerald-700 shadow-sm transition";
        tabTeks.className = "py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition";
        secGambar.classList.remove("hidden");
        secTeks.classList.add("hidden");
      }
    }

    function fillExample(text) {
      document.getElementById("teksCatatan").value = text;
    }

    // Kompresi gambar ke Base64 murni (lebar maks 1024px) agar ringan & cepat dibaca Gemini
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 1024;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
          // Pisahkan prefix "data:image/jpeg;base64," agar hanya string Base64 murni yang dikirim
          compressedBase64 = dataUrl.split(",")[1];

          // Tampilkan preview
          const preview = document.getElementById("imagePreview");
          preview.src = dataUrl;
          preview.classList.remove("hidden");
          document.getElementById("uploadPlaceholder").classList.add("hidden");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Proses Pengiriman ke Webhook Make.com
    document.getElementById("expenseForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const webhookUrl = getWebhookUrl();
      if (webhookUrl.includes("GANTI_DENGAN_URL")) {
        toggleSettings();
        alert("Silakan tempel URL Webhook Make.com antum terlebih dahulu.");
        return;
      }

      const teksCatatan = document.getElementById("teksCatatan").value.trim();
      const catatanGambar = document.getElementById("catatanTambahanGambar").value.trim();

      if (activeTab === 'teks' && !teksCatatan) {
        alert("Tuliskan catatan pengeluaran terlebih dahulu.");
        return;
      }
      if (activeTab === 'gambar' && !compressedBase64) {
        alert("Pilih atau ambil foto struk terlebih dahulu.");
        return;
      }

      setLoading(true);

      // Struktur Payload identik dengan pengujian Postman
      const payload = {
        jenis_input: activeTab,
        teks_catatan: activeTab === 'teks' ? teksCatatan : (catatanGambar || "Ekstrak data pengeluaran dari foto struk ini"),
        gambar_base64: activeTab === 'gambar' ? compressedBase64 : ""
      };

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const rawText = await response.text();
        let data = {};
        try {
          data = JSON.parse(rawText);
        } catch {
          data = { status: "accepted", message: rawText };
        }

        if (response.ok) {
          const merchant = data.merchant || "Transaksi Tercatat";
          const nominalFormatted = data.nominal 
            ? "Rp " + Number(data.nominal).toLocaleString("id-ID") 
            : "Berhasil masuk Google Sheets";

          showResult("success", merchant, `Nominal: <strong>${nominalFormatted}</strong>`);
          saveHistory(merchant, nominalFormatted);

          // Reset Form
          document.getElementById("teksCatatan").value = "";
          document.getElementById("catatanTambahanGambar").value = "";
          compressedBase64 = "";
          document.getElementById("imagePreview").classList.add("hidden");
          document.getElementById("uploadPlaceholder").classList.remove("hidden");
          document.getElementById("fileStruk").value = "";
        } else {
          showResult("error", "Gagal Memproses", `Server merespons dengan status ${response.status}.`);
        }
      } catch (error) {
        showResult("error", "Koneksi Terputus", "Pastikan internet aktif dan skenario Make.com dalam status ON.");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      const btn = document.getElementById("submitBtn");
      const text = document.getElementById("btnText");
      const loader = document.getElementById("btnLoader");

      btn.disabled = isLoading;
      if (isLoading) {
        text.textContent = "AI Sedang Membaca...";
        loader.classList.remove("hidden");
        btn.classList.add("opacity-80");
      } else {
        text.textContent = "Kirim & Catat Otomatis";
        loader.classList.add("hidden");
        btn.classList.remove("opacity-80");
      }
    }

    function showResult(type, title, subtitle) {
      const box = document.getElementById("resultBox");
      box.classList.remove("hidden", "bg-emerald-50", "border-emerald-200", "text-emerald-900", "bg-rose-50", "border-rose-200", "text-rose-900");

      if (type === "success") {
        box.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-900");
        box.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="bg-emerald-600 text-white rounded-full p-1 mt-0.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <div>
              <p class="font-bold text-sm">${title}</p>
              <p class="text-xs mt-0.5">${subtitle}</p>
            </div>
          </div>
        `;
      } else {
        box.classList.add("bg-rose-50", "border-rose-200", "text-rose-900");
        box.innerHTML = `
          <p class="font-bold text-sm">${title}</p>
          <p class="text-xs mt-0.5">${subtitle}</p>
        `;
      }
    }

    function saveHistory(merchant, nominal) {
      const history = JSON.parse(localStorage.getItem("tx_history") || "[]");
      const time = new Date().toLocaleTimeString("id-ID", { hour: '2-digit', minute: '2-digit' });
      history.unshift({ merchant, nominal, time });
      localStorage.setItem("tx_history", JSON.stringify(history.slice(0, 5)));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById("historyList");
      const history = JSON.parse(localStorage.getItem("tx_history") || "[]");
      if (history.length === 0) {
        list.innerHTML = `<p class="italic text-slate-400 text-center py-3">Belum ada transaksi dikirim dari perangkat ini.</p>`;
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="flex items-center justify-between bg-slate-50 border border-slate-100 px-3.5 py-2.5 rounded-xl">
          <div>
            <p class="font-semibold text-slate-700">${item.merchant}</p>
            <p class="text-[11px] text-slate-400">Pukul ${item.time}</p>
          </div>
          <span class="font-bold text-emerald-700">${item.nominal}</span>
        </div>
      `).join("");
    }

    function clearHistory() {
      localStorage.removeItem("tx_history");
      renderHistory();
    }
  </script>
</body>
</html>
